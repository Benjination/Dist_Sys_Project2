# Multi-machine deployment - Machine 2
# Runs nodes 4-6 using host networking for cross-machine communication
# Replace MACHINE1_IP and MACHINE2_IP with actual IP addresses

services:
  node4:
    image: bennythepooh/mpi-distributed-system
    hostname: node4
    container_name: distributed_node4
    network_mode: host
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.232.255.239  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 25"
    
  node5:
    image: bennythepooh/mpi-distributed-system
    hostname: node5
    container_name: distributed_node5
    network_mode: host
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.232.255.239  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 26"
    
  node6:
    image: bennythepooh/mpi-distributed-system
    hostname: node6
    container_name: distributed_node6
    network_mode: host
    volumes:
      - ./results:/app/results
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.232.255.239  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 27"