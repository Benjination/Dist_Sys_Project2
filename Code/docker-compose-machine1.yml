# Multi-machine deployment - Machine 1
# Runs nodes 1-3 using host networking for cross-machine communication
# Replace MACHINE1_IP and MACHINE2_IP with actual IP addresses

services:
  node1:
    image: bennythepooh/mpi-distributed-system
    hostname: node1
    container_name: distributed_node1
    network_mode: host
    volumes:
      - ./results:/app/results
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.234.95.154  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 22"
    
  node2:
    image: bennythepooh/mpi-distributed-system
    hostname: node2
    container_name: distributed_node2
    network_mode: host
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.234.95.154  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 23"
    
  node3:
    image: bennythepooh/mpi-distributed-system
    hostname: node3
    container_name: distributed_node3
    network_mode: host
    privileged: true
    environment:
      - DEPLOYMENT_MODE=multi-machine
      - MACHINE1_IP=10.234.93.155  # Replace with Machine 1 IP
      - MACHINE2_IP=10.234.95.154  # Replace with Machine 2 IP
    command: >
      sh -c "/app/create-hostfile.sh && /usr/sbin/sshd -D -p 24"